<!DOCTYPE html>
<html>
<head>
  <title>Dodge Game Enhanced</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f0f0f0;
    }
    canvas {
      background: #eee;
      display: block;
      margin: 20px auto;
      border: 2px solid #333;
    }
    #score {
      font-size: 20px;
      margin-top: 10px;
    }
    #gameOverScreen {
      display: none;
      font-size: 24px;
      color: red;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🧱 Dodge the Falling Blocks!</h1>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="score">Score: 0</div>
  <div id="gameOverScreen">💥 Game Over!</div>
  <button onclick="restartGame()">Restart</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score');
    const gameOverScreen = document.getElementById('gameOverScreen');

    let player = { x: 180, y: 350, width: 40, height: 40 };
    let blocks = [];
    let score = 0;
    let gameOver = false;
    let keys = {};

    function createBlock() {
      return {
        x: Math.random() * (canvas.width - 40),
        y: -40,
        width: 40,
        height: 40,
        speed: 3 + Math.random() * 2
      };
    }

    for (let i = 0; i < 3; i++) {
      blocks.push(createBlock());
    }

    document.addEventListener('keydown', e => keys[e.key] = true);
    document.addEventListener('keyup', e => keys[e.key] = false);

    function drawPlayer() {
      ctx.fillStyle = 'blue';
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function drawBlocks() {
      ctx.fillStyle = 'red';
      blocks.forEach(block => {
        ctx.fillRect(block.x, block.y, block.width, block.height);
        block.y += block.speed;

        if (block.y > canvas.height) {
          block.y = -40;
          block.x = Math.random() * (canvas.width - block.width);
          score++;
          scoreDisplay.textContent = "Score: " + score;
        }

        if (
          block.x < player.x + player.width &&
          block.x + block.width > player.x &&
          block.y < player.y + player.height &&
          block.y + block.height > player.y
        ) {
          gameOver = true;
          gameOverScreen.style.display = 'block';
        }
      });
    }

    function movePlayer() {
      if (keys['ArrowLeft'] && player.x > 0) player.x -= 5;
      if (keys['ArrowRight'] && player.x < canvas.width - player.width) player.x += 5;
    }

    function draw() {
      if (gameOver) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      movePlayer();
      drawPlayer();
      drawBlocks();
      requestAnimationFrame(draw);
    }

    function restartGame() {
      player.x = 180;
      score = 0;
      gameOver = false;
      gameOverScreen.style.display = 'none';
      scoreDisplay.textContent = "Score: 0";
      blocks = [];
      for (let i = 0; i < 3; i++) {
        blocks.push(createBlock());
      }
      draw();
    }

    draw();
  </script>
</body>
</html>
