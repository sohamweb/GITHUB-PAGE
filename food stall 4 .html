<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Festival Sections</title>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; padding: 20px; }
    .accordion { background: #eee; cursor: pointer; padding: 18px; margin-bottom: 10px; border: none; outline: none; transition: 0.4s; font-size: 18px; }
    .active, .accordion:hover { background-color: #ccc; }
    .panel { padding: 0 18px; display: none; background-color: white; overflow: hidden; }
    img { max-width: 100%; margin-top: 10px; border-radius: 6px; }
  </style>
</head>
<body>

<h2>Festival Highlights</h2>

<button class="accordion">🍜 Food Stall</button>
<div class="panel">
  <p>Enjoy global street food with live cooking stations and tasting booths.</p>
  <img src="https://stockcake.com/i/bustling-food-stall_1261193_917827" alt="Food Stall">
</div>

<button class="accordion">🎮 Games</button>
<div class="panel">
  <p>Play arcade classics, VR challenges, and win prizes in carnival games.</p>
  <img src="https://punishedbacklog.com/wp-content/uploads/2022/03/best-video-games-of-all-time.jpg" alt="Games">
</div>

<button class="accordion">🏺 Artifacts</button>
<div class="panel">
  <p>Explore ancient relics and cultural treasures from around the world.</p>
  <img src="https://stockcake.com/i/ancient-artifacts-display_1620012_1193807" alt="Artifacts">
</div>

<script>
  const acc = document.getElementsByClassName("accordion");
  for (let i = 0; i < acc.length; i++) {
    acc[i].onclick = function() {
      this.classList.toggle("active");
      const panel = this.nextElementSibling;
      panel.style.display = panel.style.display === "block" ? "none" : "block";
    };
  }
</script>

</body>
</html>
